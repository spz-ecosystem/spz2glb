# WASM 构建测试工作流 - 收集日志和警告

name: Test WASM Build

# 固定 run 显示名，避免 Actions 从非 ASCII commit message 派生标题时出现问号
run-name: Test WASM Build - ${{ github.ref_name }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      run_private_fixed_samples:
        description: 'Run full fixture + bench validation (synthetic + real SPZ files)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - phase5-browser-lifecycle-20260325
      - feature/spz2glb-v4-zstd-adaptation
      - clean-pr
      - feature/changelog-gate
      - feature/spz2glb-perf-panel-fix
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'docs/examples/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/test-wasm-build.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EMSCRIPTEN_VERSION: 6.0.3
  EM_CACHE: ${{ github.workspace }}/.emscripten-cache

jobs:
  test-wasm-build:
    name: Test WASM Build with Logging (${{ matrix.wasm_profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wasm_profile: [compat, perf-lite]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          # 全量历史 + tags：CMake 用 git describe --tags 同步 wasm 版本号（默认浅克隆无 tag → fallback 2.0.3）
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Cache Emscripten SDK
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.3
        with:
          path: /tmp/emsdk-cache
          key: emsdk-${{ env.EMSCRIPTEN_VERSION }}-${{ runner.os }}-${{ github.sha }}

      - name: Setup Emscripten SDK
        run: |
          if [ -d /tmp/emsdk-cache/emsdk ]; then
            echo "Using cached emsdk"
            cp -r /tmp/emsdk-cache/emsdk ./emsdk
          else
            git clone https://github.com/emscripten-core/emsdk.git --depth 1 --branch ${{ env.EMSCRIPTEN_VERSION }}
            ./emsdk/emsdk install ${{ env.EMSCRIPTEN_VERSION }}
            mkdir -p /tmp/emsdk-cache
            cp -r ./emsdk /tmp/emsdk-cache/emsdk
          fi
          ./emsdk/emsdk activate ${{ env.EMSCRIPTEN_VERSION }}
          echo "${GITHUB_WORKSPACE}/emsdk" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=${GITHUB_WORKSPACE}/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=${GITHUB_WORKSPACE}/emsdk/.emscripten" >> "$GITHUB_ENV"

      - name: Show Emscripten toolchain info
        run: |
          emcc -v
          echo "EM_CACHE=$EM_CACHE"

      - name: Install wabt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Configure WASM build
        run: |
          set -euo pipefail
          echo "=== CMake Configuration ==="
          emcmake cmake -S . -B build_wasm -DSPZ2GLB_BUILD_WASM=ON -DSPZ2GLB_WASM_PROFILE=${{ matrix.wasm_profile }} 2>&1 | tee cmake.log

      - name: Build WASM targets (verbose)
        run: |
          set -euo pipefail
          echo "=== WASM Build Output ==="
          emmake cmake --build build_wasm --config Release --target spz2glb-wasm spz_verify-wasm --verbose 2>&1 | tee build.log
          echo ""
          echo "=== Build Warnings/Errors Summary ==="
          grep -iE "(warning|error)" build.log | head -20 || echo "No warnings/errors found"

      - name: Dump build.log on failure
        if: failure()
        run: |
          echo "=== Full Build Log (last 200 lines) ==="
          test -f build.log && tail -200 build.log || echo "no build.log"
          echo "=== CMake Log (last 50 lines) ==="
          test -f cmake.log && tail -50 cmake.log || echo "no cmake.log"

      - name: Locate WASM artifacts
        run: |
          echo "=== Locate WASM Artifacts ==="
          echo "[debug] candidate wasm files:"
          find . -type f -name '*.wasm' | sort || true

          WASM_FILE=$(find . -type f -name '*.wasm' | grep -E 'spz2glb(-wasm)?\.wasm$|spz2glb\.wasm$' | head -n 1 || true)
          if [ -z "$WASM_FILE" ]; then
            WASM_FILE=$(find . -type f -name '*spz2glb*.wasm' | head -n 1 || true)
          fi

          if [ -z "$WASM_FILE" ]; then
            echo "❌ spz2glb wasm artifact not found"
            echo "[debug] dist dirs:"
            find . -type d -name dist -print || true
            echo "[debug] build_wasm tree (depth 3):"
            find build_wasm -maxdepth 3 -print || true
            exit 1
          fi

          WASM_DIR=$(dirname "$WASM_FILE")
          echo "WASM_FILE=$WASM_FILE" >> "$GITHUB_ENV"
          echo "WASM_DIR=$WASM_DIR" >> "$GITHUB_ENV"

          mkdir -p dist

          copy_if_needed() {
            local src="$1"
            local dst="$2"
            local src_abs dst_abs
            src_abs=$(readlink -f "$src")
            dst_abs=$(readlink -f "$dst" 2>/dev/null || true)
            if [ -n "$dst_abs" ] && [ "$src_abs" = "$dst_abs" ]; then
              echo "[debug] skip copy (same file): $src -> $dst"
              return 0
            fi
            cp "$src" "$dst"
          }

          copy_if_needed "$WASM_FILE" dist/spz2glb.wasm

          JS_CANDIDATE=$(find "$WASM_DIR" -maxdepth 1 -type f -name '*spz2glb*.js' | head -n 1 || true)
          if [ -n "$JS_CANDIDATE" ]; then
            copy_if_needed "$JS_CANDIDATE" dist/spz2glb.js
          fi

          DATA_CANDIDATE=$(find "$WASM_DIR" -maxdepth 1 -type f -name '*spz2glb*.data' | head -n 1 || true)
          if [ -n "$DATA_CANDIDATE" ]; then
            copy_if_needed "$DATA_CANDIDATE" dist/spz2glb.data
          fi

          ls -la "$WASM_DIR"
          ls -la dist/

      - name: Run WASM pre-check
        run: bash scripts/wasm-pre-check.sh --skip-build --build-dir build_wasm 2>&1 | tee wasm-pre-check.log

      - name: Upload pre-check logs on failure
        if: failure()
        run: |
          echo "=== WASM Build Log ==="
          test -f build.log && tail -50 build.log || echo "no build.log"
          echo "=== WASM Pre-check Log ==="
          test -f wasm-pre-check.log && cat wasm-pre-check.log || echo "no wasm-pre-check.log"

      - name: Analyze WASM imports/exports
        run: |
          echo "=== WASM File Info ==="
          ls -la dist/

          echo ""
          echo "=== WASM Full Analysis (wasm-objdump) ==="
          wasm-objdump -x dist/spz2glb.wasm 2>/dev/null | tee wasm_analysis.txt || echo "wasm-objdump failed"

          echo ""
          echo "=== Import Section ==="
          grep -A 20 "Import" wasm_analysis.txt | head -25 || echo "No imports found"

          echo ""
          echo "=== Export Section ==="
          grep -A 30 "Export" wasm_analysis.txt | head -35 || echo "No exports found"

          echo ""
          echo "=== Memory Section ==="
          grep -A 5 "Memory" wasm_analysis.txt | head -10 || echo "No memory section found"

      - name: Generate synthetic SPZ fixtures
        run: |
          echo "=== Generate synthetic SPZ fixtures ==="
          node tests/gen_fixture.mjs --out tests/data/fixtures 2>&1 | tee gen_fixture.log

      - name: Run JS logic unit tests (JSON report)
        run: |
          set -euo pipefail
          echo "=== Frontend JS logic unit tests (parseGlbJson/report/detect/queue) ==="
          node --test --test-reporter=./tests/json_reporter.mjs tests/logic.test.mjs > logic-tests.json 2>logic-tests.err
          node -e "
          const r = JSON.parse(require('fs').readFileSync('logic-tests.json','utf8'));
          console.log('pass:' + r.totals.pass + ' fail:' + r.totals.fail + ' skip:' + r.totals.skip);
          if (r.totals.fail > 0) { console.error(r.cases.filter(c => c.status !== 'pass')); process.exit(1); }
          "

      - name: Prepare fixture list for hash matrix
        run: |
          # Build fixtures.json + hash_fixtures.json for JS fetch
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dirs = ['tests/data/fixtures', 'tests/data/bench'];
          const fixtures = [];
          for (const dir of dirs) {
            if (!fs.existsSync(dir)) continue;
            for (const f of fs.readdirSync(dir).filter(f => f.endsWith('.spz')).sort()) {
              fixtures.push({name: path.basename(f, '.spz'), path: './' + dir + '/' + f});
            }
          }
          fs.writeFileSync('fixtures.json', JSON.stringify(fixtures));
          const hf = fixtures.filter(f => !f.name.includes('v4_header_only'));
          fs.writeFileSync('hash_fixtures.json', JSON.stringify(hf));
          console.log('fixtures.json: ' + fixtures.length + ' entries');
          console.log('hash_fixtures.json: ' + hf.length + ' entries (excl v4_header_only)');
          "

      - name: Validate WASM hash matrix (3 browsers)
        run: |
          set -euo pipefail
          echo "=== Validate WASM hash matrix ==="
          test -f dist/spz2glb.js
          test -f dist/spz2glb.wasm
          test -f hash_fixtures.json

          cat > hash_matrix.html << 'FIXEOF'
          <!doctype html>
          <html>
            <body>
              <script type="module">
                import { loadSpz2Glb, parseGlbJson } from './docs/examples/spz2glb_bindings.js';

                const toHex = (bytes) => Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');
                const sha256Hex = async (bytes) => {
                  const digest = await crypto.subtle.digest('SHA-256', bytes);
                  return toHex(new Uint8Array(digest));
                };

                window.__hashResult = { status: 'pending' };
                try {
                  const res = await fetch('./hash_fixtures.json');
                  if (!res.ok) throw new Error('failed to fetch hash_fixtures.json');
                  const fixtures = await res.json();
                  if (!fixtures.length) throw new Error('empty fixture list');

                  const api = await loadSpz2Glb('/dist/spz2glb.wasm', {
                    print: () => {},
                    printErr: (text) => console.error(text),
                  });
                  const rows = [];

                  for (const fixture of fixtures) {
                    const fres = await fetch(fixture.path);
                    if (!fres.ok) throw new Error(`failed to fetch ${fixture.name}: ${fixture.path}`);
                    const input = await fres.arrayBuffer();

                    const t0 = performance.now();
                    // convert() 经 withConvertLock 返回 Promise，必须 await；
                    // 且入参需 Uint8Array（内部用 .buffer/.byteOffset，ArrayBuffer 无这些属性 → 空写入 → magic 0x0）
                    const handle = await api.convert(new Uint8Array(input));
                    const conversionMs = performance.now() - t0;
                    if (!handle) throw new Error(`WASM convert failed: ${fixture.name}`);

                    let output, glbInfo;
                    try {
                      // 直接用 WASM 视图解析（与 index.html 同构），避免 JS 大对象拷贝
                      glbInfo = parseGlbJson(handle.getBytesView());
                      output = handle.getBytesView().slice();
                    } finally {
                      handle.release();
                    }

                    const hash = await sha256Hex(output.buffer);
                    rows.push({
                      name: fixture.name,
                      hash,
                      byteLength: output.byteLength,
                      conversionMs: Math.round(conversionMs * 10) / 10,
                      glb: glbInfo,
                    });
                    if (output.byteLength === 0) {
                      throw new Error(`empty output for ${fixture.name}`);
                    }
                  }

                  rows.sort((a, b) => a.name.localeCompare(b.name));
                  window.__hashResult = { status: 'ok', rows };
                } catch (error) {
                  window.__hashResult = {
                    status: 'error',
                    message: error?.message ?? String(error),
                    stack: error?.stack ?? '',
                  };
                  console.error(error);
                }
              </script>
            </body>
          </html>
          FIXEOF

          # http.server + playwright 必须与 node 脚本同一步骤：
          # 历史教训——分开步骤时 trap EXIT 会在生成步骤结束时 kill server，
          # 且 npm audit 无 lockfile 报 ENOLOCK 提前终止，导致 hash matrix 从未真正执行。
          python3 -m http.server 8001 > hash_server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT

          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium firefox webkit
          node << 'EOF' | tee wasm_hash_matrix.log
          const { writeFileSync } = require('node:fs');
          const { chromium, firefox, webkit } = require('playwright');
          const browsers = [
            { launcher: chromium, name: 'chromium' },
            { launcher: firefox, name: 'firefox' },
            { launcher: webkit, name: 'webkit' },
          ];

          (async () => {
            for (const { launcher, name } of browsers) {
              console.log(`\n=== WASM hash matrix on ${name} ===`);
              const browser = await launcher.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();
              page.on('console', (msg) => console.log(`[${name}:${msg.type()}] ${msg.text()}`));
              page.on('pageerror', (err) => console.error('[${name}:pageerror]', err.stack || err.message));

              await page.goto('http://127.0.0.1:8001/hash_matrix.html', { waitUntil: 'load' });
              await page.waitForFunction(
                () => window.__hashResult && window.__hashResult.status !== 'pending',
                null,
                { timeout: 120000 }
              );

              const result = await page.evaluate(() => window.__hashResult);
              console.log(JSON.stringify(result));
              await browser.close();

              if (result.status !== 'ok') {
                console.error(result.stack || result.message || 'wasm hash matrix failed');
                process.exit(1);
              }

              // 保持 hash 文本兼容（跨浏览器比对基准）
              const hashLines = result.rows.map((r) => `${r.hash}  ${r.name}.glb`).sort();
              writeFileSync('wasm_hashes.txt', `${hashLines.join('\n')}\n`);

              // 结构化报告：每 fixture 转换耗时 + GLB 结构字段（下载即看，无需开网页）
              writeFileSync('wasm_hash_report.json', JSON.stringify({
                browser: name,
                generatedAt: new Date().toISOString(),
                fixtures: result.rows,
              }, null, 2));
              console.log(`[PASS] ${name}\n`);
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          EOF

      - name: Test browser glue loading (3 browsers)
        run: |
          set -euo pipefail
          echo "=== Testing browser glue loading ==="
          test -f dist/spz2glb.js
          test -f dist/spz2glb.wasm

          cat > smoke.html << 'EOF'
          <!doctype html>
          <html>
            <body>
              <script type="module">
                import createSpz2glbModule from './dist/spz2glb.js';

                window.__smokeResult = { status: 'pending' };

                try {
                  const module = await createSpz2glbModule({
                    locateFile(path) {
                      return path.endsWith('.wasm') ? './dist/spz2glb.wasm' : path;
                    },
                    print() {},
                    printErr(text) {
                      console.error(text);
                    },
                  });

                  const ptr = module._spz2glb_alloc(12);
                  module._spz2glb_get_version(ptr, ptr + 4, ptr + 8);
                  const version = `${module.getValue(ptr, 'i32')}.${module.getValue(ptr + 4, 'i32')}.${module.getValue(ptr + 8, 'i32')}`;
                  module._spz2glb_free(ptr);

                  window.__smokeResult = {
                    status: 'ok',
                    version,
                    exports: Object.keys(module).filter((key) => key.startsWith('_')).slice(0, 10),
                  };
                } catch (error) {
                  window.__smokeResult = {
                    status: 'error',
                    message: error?.message ?? String(error),
                    stack: error?.stack ?? '',
                  };
                  console.error(error);
                }
              </script>
            </body>
          </html>
          EOF

          # 与 hash matrix 同理：http.server + playwright + node 必须同一步骤
          # （分步时 trap EXIT 提前 kill server + npm audit ENOLOCK 终止 → 从未真正执行）
          python3 -m http.server 8000 > browser_server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT

          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium firefox webkit
          node << 'EOF' | tee browser_smoke.log
          const { chromium, firefox, webkit } = require('playwright');
          const browsers = [
            { launcher: chromium, name: 'chromium' },
            { launcher: firefox, name: 'firefox' },
            { launcher: webkit, name: 'webkit' },
          ];

          (async () => {
            for (const { launcher, name } of browsers) {
              console.log(`\n=== Browser glue smoke test on ${name} ===`);
              const browser = await launcher.launch({ headless: true });
              const page = await browser.newPage();
              page.on('console', (msg) => console.log(`[${name}:${msg.type()}] ${msg.text()}`));
              page.on('pageerror', (err) => console.error(`[${name}:pageerror]`, err.stack || err.message));

              await page.goto('http://127.0.0.1:8000/smoke.html', { waitUntil: 'load' });
              await page.waitForFunction(
                () => window.__smokeResult && window.__smokeResult.status !== 'pending',
                null,
                { timeout: 30000 }
              );

              const result = await page.evaluate(() => window.__smokeResult);
              console.log(JSON.stringify(result));
              await browser.close();

              if (result.status !== 'ok') {
                console.error(result.stack || result.message || 'browser glue smoke failed');
                process.exit(1);
              }
              console.log(`[PASS] ${name}\n`);
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-build-logs-${{ matrix.wasm_profile }}
          path: |
            cmake.log
            build.log
            wasm_analysis.txt
            wasm_hash_matrix.log
            wasm_hashes.txt
            wasm_hash_report.json
            wasm-pre-check.log
            logic-tests.json
            logic-tests.err
            smoke.html
            browser_server.log
            browser_smoke.log
            dist/
            build_wasm/dist/
          retention-days: 7

      - name: WASM post-build failure summary
        if: failure()
        shell: bash
        run: |
          echo "=== WASM Pre-Check Failure Summary ==="
          for stage in P0_ENV P1_BUILD P2_SYMBOL P3_ARTIFACT P4_WASM_ANALYSIS P5_WORKFLOW P6_INTEGRITY P7_DEADCODE; do
            echo "--- $stage ---"
            grep -E "\\b${stage}\\b" wasm-pre-check.log 2>/dev/null || echo "(no log for $stage)"
          done
          echo "=== WASM Binary Sizes ==="
          ls -lh dist/*.wasm 2>/dev/null || echo "(no wasm files in dist)"
          echo "=== WASM Export Table ==="
          test -f wasm_analysis.txt && head -30 wasm_analysis.txt || echo "(no wasm_analysis.txt)"

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install audit tools
        run: |
          pip install zizmor==1.26.0
          # actionlint via gh — no persistent install needed in CI

      - name: Scan GitHub Actions workflows with actionlint
        shell: bash
        run: |
          # Use actionlint from gh CLI to avoid Go toolchain install
          if command -v actionlint >/dev/null 2>&1; then
            actionlint .github/workflows/*.yml
          elif command -v gh >/dev/null 2>&1; then
            echo "actionlint not installed — consider adding to CI setup" >&2
          else
            echo "actionlint not available — skipping" >&2
          fi

      - name: Scan GitHub Actions workflows with zizmor
        run: zizmor --format plain --min-severity high .github/workflows/

  fixture-and-bench-validation:
    name: Fixture + Bench CLI validation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_private_fixed_samples == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          # 全量历史 + tags：CMake 用 git describe --tags 同步 wasm 版本号（默认浅克隆无 tag → fallback 2.0.3）
          fetch-depth: 0

      - name: Generate synthetic SPZ fixtures
        run: |
          node tests/gen_fixture.mjs --out tests/data/fixtures 2>&1

      - name: Enumerate test samples
        id: samples
        run: |
          echo "=== Synthetic fixtures ==="
          ls -la tests/data/fixtures/*.spz 2>/dev/null || echo "(none)"

          echo ""
          echo "=== Bench dataset files (in-repo) ==="
          ls -la tests/data/bench/*.spz 2>/dev/null || echo "(none)"

          # Build list of all .spz files for testing
          ALL_SAMPLES=$(find tests/data/fixtures tests/data/bench -name '*.spz' -type f 2>/dev/null | sort || true)
          echo "ALL_SAMPLES<<EOF" >> "$GITHUB_ENV"
          echo "$ALL_SAMPLES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          SAMPLE_COUNT=$(echo "$ALL_SAMPLES" | wc -l)
          echo "Total test samples: $SAMPLE_COUNT"

      - name: Build native CLI tools
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target spz2glb spz_verify

      - name: Validate all 5 layers on all samples
        run: |
          set -euo pipefail
          mkdir -p tests/output
          : > layer_verify.log
          : > cli_hashes.txt
          FAILURES=0
          HAS_CONVERTIBLE=false
          while IFS= read -r spz_file; do
            [ -z "$spz_file" ] && continue
            base=$(basename "$spz_file" .spz)
            echo "=== $base ===" | tee -a layer_verify.log

            # v4_header_only: structural check only (expected to fail conversion)
            if echo "$base" | grep -q 'v4_header_only'; then
              echo "  [EDGE CASE] v4 header-only — structural check only" | tee -a layer_verify.log
              if ./dist/spz2glb "$spz_file" "tests/output/${base}.glb" 2>&1 | tee -a layer_verify.log; then
                echo "  [INFO] v4 header-only converted successfully (unexpected but OK)" | tee -a layer_verify.log
              else
                echo "  [OK] v4 header-only conversion failed as expected (edge case)" | tee -a layer_verify.log
              fi
              continue
            fi

            HAS_CONVERTIBLE=true
            if ! ./dist/spz2glb "$spz_file" "tests/output/${base}.glb" 2>&1 | tee -a layer_verify.log; then
              FAILURES=$((FAILURES+1))
              continue
            fi
            if ! ./dist/spz_verify all "$spz_file" "tests/output/${base}.glb" 2>&1 | tee -a layer_verify.log; then
              FAILURES=$((FAILURES+1))
              continue
            fi
          done <<< "$ALL_SAMPLES"
          find tests/output -name '*.glb' -type f | sort | xargs sha256sum 2>/dev/null | awk '{print $1"  "$2}' > cli_hashes.txt
          if [ "$FAILURES" -gt 0 ]; then
            echo "FAILED: $FAILURES convertible samples failed (edge cases excluded)"
            exit 1
          fi
          if [ "$HAS_CONVERTIBLE" != "true" ]; then
            echo "FAILED: No convertible samples found"
            exit 1
          fi
          echo "All convertible samples passed 5-layer verification."

      - name: Upload verification logs
