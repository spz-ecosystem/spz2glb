# 自动构建和发布

name: Release

on:
  push:
    branches:
      - main
      - feature/spz2glb-v4-zstd-adaptation
      - clean-pr
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: '可选：指定稳定 run-id 以执行手动回退（复用该 run 的 artifact）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EMSCRIPTEN_VERSION: 6.0.3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: spz2glb-windows-x64.exe
            arch: windows-x64
          - os: ubuntu-latest
            artifact: spz2glb-linux-x64
            arch: linux-x64
          - os: macos-15-intel
            artifact: spz2glb-macos-x64
            arch: macos-x64
          - os: macos-latest
            artifact: spz2glb-macos-arm64
            arch: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install zlib

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg --depth 1
          C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          C:/vcpkg/vcpkg install zlib:x64-windows

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Configure CMake (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build fastgltf (with warnings suppressed)
        run: |
          set -euo pipefail
          cmake --build build --config Release -j4 --target fastgltf 2>&1 | tee build.log

      - name: Build spz2glb (strict warnings)
        run: |
          set -euo pipefail
          cmake --build build --config Release -j4 --target spz2glb 2>&1 | tee -a build.log

      - name: Build spz_verify (strict warnings)
        run: |
          set -euo pipefail
          cmake --build build --config Release -j4 --target spz_verify 2>&1 | tee -a build.log

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "=== Build Log (last 100 lines) ==="
          test -f build.log && tail -100 build.log || echo "no build.log"

      - name: Find built executables
        run: |
          find . -name "spz2glb*" -type f
          find . -name "spz_verify*" -type f
        shell: bash

      - name: Rename artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Get-ChildItem -Recurse -Filter "spz2glb.exe" | ForEach-Object { Copy-Item $_.FullName "$PWD/${{ matrix.artifact }}" }
          Get-ChildItem -Recurse -Filter "spz_verify.exe" | ForEach-Object { Copy-Item $_.FullName "$PWD/spz_verify-windows-x64.exe" }
        shell: pwsh

      - name: Rename artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          find . -name "spz2glb" -type f -exec cp {} ${{ matrix.artifact }} \;
          find . -name "spz_verify" -type f -exec cp {} spz_verify-linux-x64 \;

      - name: Rename artifacts (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          find . -name "spz2glb" -type f -exec cp {} ${{ matrix.artifact }} \;
          find . -name "spz_verify" -type f -exec cp {} spz_verify-${{ matrix.arch }} \;

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

      - name: Upload verify artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.os }}-verify
          path: spz_verify*

  wasm-build:
    name: Build WASM (${{ matrix.wasm_profile }})
    runs-on: ubuntu-latest
    env:
      EM_CACHE: ${{ github.workspace }}/.emscripten-cache
    strategy:
      fail-fast: false
      matrix:
        wasm_profile: [compat, perf-lite]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git --depth 1 --branch ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk/emsdk install ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk/emsdk activate ${{ env.EMSCRIPTEN_VERSION }}
          echo "${GITHUB_WORKSPACE}/emsdk" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=${GITHUB_WORKSPACE}/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=${GITHUB_WORKSPACE}/emsdk/.emscripten" >> "$GITHUB_ENV"

      - name: Show Emscripten toolchain info
        run: |
          emcc -v
          echo "EM_CACHE=$EM_CACHE"

      - name: Configure WASM build
        run: |
          emcmake cmake -S . -B build_wasm \
            -DSPZ2GLB_BUILD_WASM=ON \
            -DSPZ2GLB_WASM_PROFILE=${{ matrix.wasm_profile }}

      - name: Build spz2glb WASM
        run: |
          set -euo pipefail
          emmake cmake --build build_wasm --config Release --target spz2glb-wasm 2>&1 | tee build_wasm.log

      - name: Build spz_verify WASM
        run: |
          set -euo pipefail
          emmake cmake --build build_wasm --config Release --target spz_verify-wasm 2>&1 | tee -a build_wasm.log

      - name: Dump WASM build log on failure
        if: failure()
        run: |
          echo "=== WASM Build Log (last 100 lines) ==="
          test -f build_wasm.log && tail -100 build_wasm.log || echo "no build_wasm.log"

      - name: Validate WASM outputs
        run: |
          test -f dist/spz2glb.wasm
          test -f dist/spz2glb.js
          test -f dist/spz_verify.wasm
          test -f dist/spz_verify.js

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-modules-${{ matrix.wasm_profile }}
          path: |
            dist/spz2glb.wasm
            dist/spz2glb.js
            dist/spz_verify.wasm
            dist/spz_verify.js
          retention-days: 7

  verify-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev mingw-w64

      # P6 文件完整性检查（从 wasm-pre-check.sh 复制）：UTF-8 编码 + CMake 语法
      - name: File integrity check (UTF-8 + CMake syntax)
        run: |
          set -euo pipefail
          failures=0
          echo "=== UTF-8 encoding check ==="
          while IFS= read -r -d '' f; do
            if ! python3 -c "open('$f','rb').read().decode('utf-8')" 2>/dev/null; then
              echo "  INVALID UTF-8: $f" >&2
              failures=$((failures + 1))
            fi
          done < <(find src -name '*.cpp' -o -name '*.h' -o -name '*.hpp' 2>/dev/null | tr '\n' '\0')
          echo "=== CMake syntax check ==="
          bad_sets="$(grep -cPn 'set\([A-Za-z_][A-Za-z0-9_]*::' CMakeLists.txt 2>/dev/null || true)"
          if [ "${bad_sets}" -gt 0 ]; then
            echo "  ERROR: ${bad_sets} invalid set(XXX::YYY) pattern(s)" >&2
            grep -Pn 'set\([A-Za-z_][A-Za-z0-9_]*::' CMakeLists.txt >&2
            failures=$((failures + bad_sets))
          fi
          if [ "${failures}" -gt 0 ]; then
            echo "FAIL: ${failures} integrity issue(s) found"
            exit 1
          fi
          echo "[PASS] All files pass UTF-8 and CMake syntax checks"

      - name: Native Linux build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target spz2glb spz_verify -- -j4

      - name: Run ctest
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run quick verification suite
        run: |
          bash tests/quick_test.sh

      # MinGW 交叉编译语法检查：仅检查 header 在 _WIN32 下能否通过语法编译，
      # 不涉及链接，因此无需处理 ZLIB/ZSTD 等依赖。捕获 #ifdef guard 不匹配。
      - name: MinGW cross-compilation check
        run: |
          set -euo pipefail
          failures=0
          for hdr in src/mapped_file.h; do
            if [ -f "$hdr" ]; then
              echo "  Checking: $hdr"
              if ! x86_64-w64-mingw32-g++ -std=c++20 -fsyntax-only -I third_party/include -I third_party/deps/simdjson -c -x c++ "$hdr" 2>&1; then
                echo "  [FAIL] $hdr failed under MinGW (_WIN32)"
                failures=$((failures + 1))
              else
                echo "  [PASS] $hdr"
              fi
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "ERROR: $failures header(s) have Windows compilation issues"
            exit 1
          fi
          echo "[PASS] MinGW cross-compilation syntax check passed"


  release:
    needs: [build, wasm-build, verify-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release job needs contents: write for tag operations
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download release artifacts (CLI)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'spz2glb-*'
          path: artifacts
          merge-multiple: true

      - name: Download release artifacts (verify)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-verify'
          path: artifacts
          merge-multiple: true

      - name: Download release artifacts (WASM profiles)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'wasm-modules-*'
          path: artifacts/wasm
          merge-multiple: false

      - name: Normalize WASM artifact names for release assets
        run: |
          for profile_dir in artifacts/wasm/wasm-modules-*; do
            [ -d "$profile_dir" ] || continue
            profile="${profile_dir##*/wasm-modules-}"
            for file in spz2glb.js spz2glb.wasm spz_verify.js spz_verify.wasm; do
              src="$profile_dir/$file"
              [ -f "$src" ] || continue
              base="${file%.*}"
              ext="${file##*.}"
              cp "$src" "artifacts/${base}-${profile}.${ext}"
            done
          done
          rm -rf artifacts/wasm

      - name: Generate release manifest
        run: |
          (cd artifacts && find . -type f -print0 | sort -z | xargs -0 sha256sum > release-sha256.txt)

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rollback-artifact-entry:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_run_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify rollback source run
        env:
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== Verifying rollback source run #${ROLLBACK_RUN_ID} ==="
          # Fetch run metadata
          RUN_JSON="$(gh run view "${ROLLBACK_RUN_ID}" \
            --repo ${{ github.repository }} \
            --json headBranch,workflowName,conclusion,headSha,databaseId 2>&1)"
          echo "Run metadata: ${RUN_JSON}"
          # Parse and validate
          HEAD_BRANCH="$(echo "${RUN_JSON}" | jq -r '.headBranch // empty')"
          WORKFLOW_NAME="$(echo "${RUN_JSON}" | jq -r '.workflowName // empty')"
          CONCLUSION="$(echo "${RUN_JSON}" | jq -r '.conclusion // empty')"
          echo "  Branch: ${HEAD_BRANCH}"
          echo "  Workflow: ${WORKFLOW_NAME}"
          echo "  Conclusion: ${CONCLUSION}"
          # Only allow main branch, release workflow, successful runs
          if [ "${HEAD_BRANCH}" != "main" ]; then
            echo "[SECURITY] Rejected: rollback source must be on 'main' branch, got '${HEAD_BRANCH}'"
            exit 1
          fi
          if [ "${CONCLUSION}" != "success" ]; then
            echo "[SECURITY] Rejected: rollback source run did not complete successfully"
            exit 1
          fi
          echo "[PASS] Rollback source verified — main branch, successful run"

      - name: Download artifacts from stable run
        env:
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${ROLLBACK_RUN_ID}" \
            --repo ${{ github.repository }} \
            --dir rollback_artifacts

      - name: Generate rollback execution manifest
        env:
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
          TRIGGER_ACTOR: ${{ github.actor }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          # Re-fetch verified metadata for manifest
          RUN_JSON="$(gh run view "${ROLLBACK_RUN_ID}" \
            --repo ${{ github.repository }} \
            --json headBranch,headSha,conclusion,databaseId 2>&1)"
          VERIFIED_BRANCH="$(echo "${RUN_JSON}" | jq -r '.headBranch // empty')"
          VERIFIED_SHA="$(echo "${RUN_JSON}" | jq -r '.headSha // empty')"
          {
            echo "current_run_id=${{ github.run_id }}"
            echo "rollback_source_run_id=${ROLLBACK_RUN_ID}"
            echo "verified_branch=${VERIFIED_BRANCH}"
            echo "verified_commit=${VERIFIED_SHA}"
            echo "trigger_actor=${TRIGGER_ACTOR}"
            echo "trigger_ref=${TRIGGER_REF}"
            echo "artifact_count=$(find rollback_artifacts -type f | wc -l)"
            echo "sha256_artifacts=$(find rollback_artifacts -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)"
          } > rollback-manual-manifest.txt

      - name: Upload rollback restored artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rollback-restored
          path: |
            rollback_artifacts
            rollback-manual-manifest.txt

  rollback-manifest:
    if: always() && contains(join(needs.*.result, ','), 'failure')
    needs: [build, wasm-build, verify-native, release]
    runs-on: ubuntu-latest
    steps:
      - name: Find previous stable run
        id: stable
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const res = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              status: 'completed',
              per_page: 100
            });
            const stable = res.data.workflow_runs.find(r =>
              r.name === context.workflow &&
              r.conclusion === 'success' &&
              r.id !== context.runId
            );
            core.setOutput('run_id', stable ? String(stable.id) : '');
            core.setOutput('head_sha', stable ? String(stable.head_sha) : '');

      - name: Generate rollback manifest
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          STABLE_RUN_ID: ${{ steps.stable.outputs.run_id }}
          STABLE_HEAD_SHA: ${{ steps.stable.outputs.head_sha }}
        run: |
          FAILED_JOBS=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' | paste -sd, -)
          {
            echo "current_run_id=${{ github.run_id }}"
            echo "current_sha=${{ github.sha }}"
            echo "previous_stable_run_id=${STABLE_RUN_ID}"
            echo "previous_stable_commit=${STABLE_HEAD_SHA}"
            echo "failed_jobs=${FAILED_JOBS}"
          } > rollback-manifest.txt

      - name: Upload rollback manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rollback-manifest
          path: rollback-manifest.txt
          retention-days: 7
