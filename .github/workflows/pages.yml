# 独立 Pages 部署 Workflow
# 照搬门卫 (spz_gatekeeper) 的 pages.yml 结构
# 与 release.yml 解耦，仅管理 GitHub Pages 构建和部署

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EMSCRIPTEN_VERSION: 6.0.3

jobs:
  build_pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git --depth 1 --branch ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk/emsdk install ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk/emsdk activate ${{ env.EMSCRIPTEN_VERSION }}
          echo "${GITHUB_WORKSPACE}/emsdk" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=${GITHUB_WORKSPACE}/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=${GITHUB_WORKSPACE}/emsdk/.emscripten" >> "$GITHUB_ENV"

      - name: Show Emscripten toolchain info
        run: |
          emcc -v

      - name: Configure WASM build
        run: |
          emcmake cmake -S . -B build_pages \
            -DSPZ2GLB_BUILD_WASM=ON \
            -DSPZ2GLB_WASM_PROFILE=compat

      - name: Build spz2glb WASM
        shell: bash
        run: |
          set -euo pipefail
          emmake cmake --build build_pages --config Release --target spz2glb-wasm 2>&1 | tee build_pages.log

      - name: Dump build log on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Build Log (last 100 lines) ==="
          test -f build_pages.log && tail -100 build_pages.log || echo "no build_pages.log"

      - name: Prepare Pages artifact
        run: |
          test -f dist/spz2glb.wasm
          test -f dist/spz2glb.js
          test -f docs/examples/index.html
          test -f docs/examples/spz2glb_bindings.js
          test -f docs/examples/smart_memory.js
          mkdir -p site
          cp docs/examples/index.html site/index.html
          cp docs/examples/spz2glb_bindings.js site/spz2glb_bindings.js
          cp docs/examples/smart_memory.js site/smart_memory.js
          cp dist/spz2glb.wasm site/spz2glb.wasm
          cp dist/spz2glb.js site/spz2glb.js

      - name: Generate SHA256 artifact manifest
        run: |
          cd site && sha256sum index.html spz2glb_bindings.js smart_memory.js spz2glb.wasm spz2glb.js > pages-artifact-sha256.txt && cat pages-artifact-sha256.txt

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy_pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_pages
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
