<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPZ → GLB 在线转换器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-radius: 16px;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 640px; }
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 48px 40px;
        }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .header p { color: var(--text-secondary); font-size: 16px; }

        .drop-zone {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .drop-zone:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .drop-zone input { display: none; }
        .drop-icon { font-size: 48px; margin-bottom: 16px; }
        .drop-text { font-size: 16px; color: var(--text-primary); margin-bottom: 4px; }
        .drop-hint { font-size: 13px; color: var(--text-secondary); }

        /* 队列状态条 */
        .queue-bar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }
        .queue-stat {
            flex: 1;
            padding: 8px 4px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            background: #f3f4f6;
        }
        .queue-stat .count { font-size: 18px; font-weight: 700; }
        .queue-stat.pending .count { color: var(--warning); }
        .queue-stat.processing .count { color: var(--primary); }
        .queue-stat.done .count { color: var(--success); }
        .queue-stat.failed .count { color: var(--error); }

        /* 文件列表 */
        .file-list { margin-top: 16px; display: none; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .file-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item .status-badge {
            font-weight: 600;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
            white-space: nowrap;
        }
        .file-item .status-badge.queued { background: #fef3c7; color: #92400e; }
        .file-item .status-badge.processing { background: #dbeafe; color: #1e40af; }
        .file-item .status-badge.done { background: #d1fae5; color: #065f46; }
        .file-item .status-badge.failed { background: #fee2e2; color: #991b1b; }

        .file-item .actions {
            display: flex;
            gap: 6px;
            margin-left: 8px;
        }
        .file-item .actions button {
            width: auto;
            margin: 0;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background: var(--primary);
            color: white;
            transition: opacity 0.2s;
        }
        .file-item .actions button:hover { opacity: 0.8; }
        .file-item .actions button.report-btn { background: #374151; }

        .status {
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        .status.loading { background: #fef3c7; color: var(--warning); }
        .status.success { background: #d1fae5; color: var(--success); }
        .status.error { background: #fee2e2; color: var(--error); }
        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 队列完成项滑出动画（自动清理的前奏，对齐门卫 queue-exit） */
        @keyframes slideOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(30px); }
        }
        .queue-exit { animation: slideOut 0.5s ease forwards; }
        /* 队列状态数字跳变 */
        .queue-stat .count { transition: all 0.25s ease; }

        button:disabled { background: #d1d5db; cursor: not-allowed; }

        /* 性能面板 */
        .perf-panel {
            margin-top: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            font-size: 12px;
        }
        .perf-panel summary {
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            user-select: none;
        }
        .perf-panel summary:hover { background: #f1f5f9; }
        .perf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: #e2e8f0;
        }
        .perf-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 14px;
            background: #fff;
        }
        .perf-item .label { color: var(--text-secondary); }
        .perf-item .value { font-weight: 600; color: var(--text-primary); font-family: monospace; }
        .perf-item.warn .value { color: var(--warning); }
        .perf-item.error .value { color: var(--error); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🌀 SPZ → GLB</h1>
                <p>高性能 WebAssembly 在线转换 · 支持多文件队列</p>
            </div>

            <div class="drop-zone" id="dropZone">
                <input type="file" id="fileInput" accept=".spz" multiple>
                <div class="drop-icon">📁</div>
                <div class="drop-text">点击或拖拽选择 SPZ 文件</div>
                <div class="drop-hint">支持多文件批量选择</div>
            </div>

            <!-- 队列状态条 -->
            <div class="queue-bar" id="queueBar" style="display:none;">
                <div class="queue-stat pending" id="qPending"><div class="count">0</div>待处理</div>
                <div class="queue-stat processing" id="qProcessing"><div class="count">0</div>处理中</div>
                <div class="queue-stat done" id="qDone"><div class="count">0</div>已完成</div>
                <div class="queue-stat failed" id="qFailed"><div class="count">0</div>失败</div>
            </div>

            <!-- 文件列表 -->
            <div class="file-list" id="fileList"></div>

            <div class="status" id="statusBox"></div>

            <!-- 性能面板 -->
            <details class="perf-panel" id="perfPanel" style="display:none">
                <summary>📊 运行时状态</summary>
                <div class="perf-grid" id="perfGrid"></div>
            </details>
        </div>
    </div>

    <script type="module">
        import { loadSpz2Glb, parseGlbJson, generateReportJson, detectSpzVersion, queueCounts } from './spz2glb_bindings.js';
        import SmartMemoryManager from './smart_memory.js';

        let spz2glb = null;
        let memManager = null;
        let queue = [];
        // 最近一次转换的结果（供性能面板显示，每次转换完成后刷新）
        let lastConversion = null;
        let processing = 0;
        // wasm 预留缓冲区单例 + bindings 互斥锁 → 转换必须串行。
        // MAX_PARALLEL=1：第二个文件保持 queued 排队等待（显示准确、计时不含等待时间）。
        const MAX_PARALLEL = 1;

        function showStatus(msg, type) {
            const el = document.getElementById('statusBox');
            el.style.display = 'block';
            el.className = 'status ' + type;
            el.innerHTML = msg;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }

        function updateQueueBar() {
            if (queue.length === 0) {
                // 队列清空时隐藏状态条（避免残留 0/0/0/0 空条）
                document.getElementById('queueBar').style.display = 'none';
                return;
            }
            // 纯函数统计（bindings.js 导出，CI 单测覆盖队列状态机）
            const counts = queueCounts(queue);
            // 注意：状态名是 'queued'（不是 'pending'），需映射到"待处理"计数
            document.getElementById('qPending').querySelector('.count').textContent = counts.queued;
            document.getElementById('qProcessing').querySelector('.count').textContent = counts.processing;
            document.getElementById('qDone').querySelector('.count').textContent = counts.done;
            document.getElementById('qFailed').querySelector('.count').textContent = counts.failed;
            document.getElementById('queueBar').style.display = 'flex';
        }

        function renderFileList() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            for (const item of queue) {
                const div = document.createElement('div');
                div.className = 'file-item' + (item.status === 'done' || item.status === 'failed' ? ' queue-exit' : '');
                div.id = 'fi-' + item.id;

                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = item.file.name;

                const badge = document.createElement('span');
                badge.className = 'status-badge ' + item.status;
                const labels = { queued: '排队中', processing: '转换中', done: '已完成', failed: '失败' };
                badge.textContent = labels[item.status] || item.status;

                const actions = document.createElement('span');
                actions.className = 'actions';

                if (item.status === 'done') {
                    const dlBtn = document.createElement('button');
                    dlBtn.textContent = 'GLB';
                    dlBtn.addEventListener('click', () => downloadFile(item.glbBlob, item.file.name.replace(/\.spz$/i, '.glb')));
                    actions.appendChild(dlBtn);

                    const rptBtn = document.createElement('button');
                    rptBtn.className = 'report-btn';
                    rptBtn.textContent = '📋 报告';
                    rptBtn.addEventListener('click', () => {
                        const blob = new Blob([item.reportJson], { type: 'application/json' });
                        downloadFile(blob, item.file.name.replace(/\.spz$/i, '.glb') + '.report.json');
                    });
                    actions.appendChild(rptBtn);
                } else if (item.status === 'failed') {
                    const rptBtn = document.createElement('button');
                    rptBtn.className = 'report-btn';
                    rptBtn.textContent = '📋 报告';
                    rptBtn.addEventListener('click', () => {
                        const blob = new Blob([item.reportJson], { type: 'application/json' });
                        downloadFile(blob, item.file.name.replace(/\.spz$/i, '.glb') + '.report.json');
                    });
                    actions.appendChild(rptBtn);
                }

                div.appendChild(nameSpan);
                div.appendChild(badge);
                div.appendChild(actions);
                list.appendChild(div);
            }
            list.style.display = queue.length > 0 ? 'block' : 'none';
        }

        function downloadFile(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function processItem(item) {
            processing++;
            item.status = 'processing';
            updateQueueBar();
            renderFileList();

            const file = item.file;
            const startTime = performance.now();
            let glbResult = null;
            let success = false;
            let errorMsg = '';
            let glbInfo = null;
            let conversionMs = null;   // 纯 WASM 转换耗时（分段计时，定位波动源）

            try {
                showStatus(`<span class="loading-spinner"></span>转换: ${file.name}`, 'loading');

                // SPZ 头部预检（转换前）：读文件头 64B，detectSpzVersion 按魔数识别
                // v3 gzip (1F8B) / v4 zstd (NGSP)。非法文件提前报错，避免进入 WASM 转换。
                // 注：不用 WASM validateSpzHeader——它对 gzip 需完整解压才能读 header，64B 头部会误拒。
                const spzHead = new Uint8Array(await file.slice(0, Math.min(64, file.size)).arrayBuffer());
                item.spzDetect = detectSpzVersion(spzHead);
                if (item.spzDetect.version === 0) {
                    throw new Error('无法识别 SPZ 文件头（既非 v3 gzip 也非 v4 zstd/NGSP）');
                }

                const tConv = performance.now();
                glbResult = await spz2glb.convertFile(file);
                conversionMs = performance.now() - tConv;

                if (!glbResult) {
                    throw new Error('WASM 转换返回空结果');
                }

                // 解析 GLB JSON（直接用 WASM 视图，避免 26MB JS 大对象拷贝；
                // parseGlbJson 同步执行且只读复制，release() 前完成即可）
                const glbBytes = glbResult.getBytesView();
                glbInfo = parseGlbJson(glbBytes);

                // 构建报告（复用转换前的头部预检结果）
                item.reportJson = generateReportJson({
                    fileName: file.name,
                    spzSizeBytes: file.size,
                    spzVersion: item.spzDetect.version,
                    compression: item.spzDetect.compression,
                    glbSizeBytes: glbResult.size,
                    glbInfo,
                    success: true,
                    timingMs: performance.now() - startTime,
                    conversionMs,
                });

                // 保存 GLB 供下载（toBlob 在 release 前同步复制，Blob 独立持有副本）
                item.glbBlob = glbResult.toBlob('application/octet-stream');

                success = true;
                showStatus(`✅ ${file.name} 转换成功`, 'success');

                // 打包完成自动下载：GLB + JSON 报告
                // （浏览器可能拦截无手势自动下载，需在设置中允许自动下载）
                const glbName = file.name.replace(/\.spz$/i, '.glb');
                downloadFile(item.glbBlob, glbName);
                downloadFile(new Blob([item.reportJson], { type: 'application/json' }), glbName + '.report.json');
            } catch (err) {
                errorMsg = err.message;
                item.reportJson = generateReportJson({
                    fileName: file.name,
                    spzSizeBytes: file.size,
                    spzVersion: 0,
                    compression: 'unknown',
                    glbSizeBytes: 0,
                    glbInfo: null,
                    success: false,
                    errorMsg: err.message,
                    timingMs: performance.now() - startTime,
                    conversionMs,
                });
                showStatus(`❌ ${file.name}: ${err.message}`, 'error');
            } finally {
                if (glbResult) glbResult.release();
                item.status = success ? 'done' : 'failed';
                processing--;
                // 记录最近一次转换（面板显示，带 ms 单位 + SPZ 版本/压缩格式）
                lastConversion = {
                    name: file.name,
                    timingMs: performance.now() - startTime,
                    conversionMs,
                    success,
                    // 文件头部预检结果（v3 gzip / v4 zstd / 未知）
                    spzVersion: item.spzDetect ? item.spzDetect.version : null,
                    compression: item.spzDetect ? item.spzDetect.compression : null,
                };
                updateQueueBar();
                renderFileList();
                // 转换完成后刷新性能面板，留存本次转换的内存/分配统计
                renderPerfPanel();
                // 自动推进队列（不依赖完成项移除）
                processQueue();
                // 滑出动画（0.5s）结束后自动清理完成项，释放 file/glbBlob 大引用（搞定自动释放）
                clearTimeout(item._cleanupTimer);
                item._cleanupTimer = setTimeout(() => {
                    queue = queue.filter(i => i.status === 'queued' || i.status === 'processing');
                    updateQueueBar();
                    renderFileList();
                }, 1500);
            }
        }

        async function processQueue() {
            if (!spz2glb) return;

            const nextItems = queue.filter(item => item.status === 'queued');
            while (processing < MAX_PARALLEL && nextItems.length > 0) {
                const item = nextItems.shift();
                processItem(item);
                // 等待微任务让队列状态更新
                await new Promise(resolve => setTimeout(resolve, 0));
            }

            const allDone = queue.every(item => item.status === 'done' || item.status === 'failed');
            if (allDone && queue.length > 0) {
                const doneCount = queue.filter(i => i.status === 'done').length;
                const failCount = queue.filter(i => i.status === 'failed').length;
                showStatus(`✅ 队列完成: ${doneCount} 成功, ${failCount} 失败`, doneCount > 0 ? 'success' : 'error');
            }
        }

        function addFilesToQueue(fileList) {
            for (const file of fileList) {
                if (!file.name.endsWith('.spz')) continue;
                // 去重
                if (queue.some(item => item.file.name === file.name && item.file.size === file.size)) continue;
                queue.push({
                    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    file,
                    status: 'queued',
                    glbBlob: null,
                    reportJson: '',
                });
            }
            updateQueueBar();
            renderFileList();
            processQueue();
        }

        function renderPerfPanel() {
            if (!spz2glb) return;
            const panel = document.getElementById('perfPanel');
            const grid = document.getElementById('perfGrid');
            panel.style.display = '';

            // 构建时间标识：CI 部署时替换 __BUILD_TIME__（每次部署变化，确认加载的是新构建）
            window.__SPZ_BUILD_TIME__ = window.__SPZ_BUILD_TIME__ || "__BUILD_TIME__";

            const stats = spz2glb.getMemoryStats();
            const info = memManager.getInfo();
            const version = spz2glb.getVersion();
            const buildTime = window.__SPZ_BUILD_TIME__ && !window.__SPZ_BUILD_TIME__.includes('__BUILD__')
                ? window.__SPZ_BUILD_TIME__ : '—';

            const rows = [
                { label: 'WASM 版本', value: version },
                { label: '构建时间', value: buildTime },
                { label: '加载时间戳', value: window.spzLoadStamp
                    ? new Date(window.spzLoadStamp).toLocaleTimeString('zh-CN', { hour12: false }) + '.' + String(window.spzLoadStamp % 1000).padStart(3, '0')
                    : '—' },
                { label: '最近转换', value: lastConversion ? lastConversion.name : '—' },
                { label: 'SPZ 版本', value: lastConversion && lastConversion.spzVersion ? `v${lastConversion.spzVersion} (${lastConversion.compression})` : '—' },
                { label: 'WASM 转换耗时', value: lastConversion && lastConversion.conversionMs != null ? `${Math.round(lastConversion.conversionMs)} ms` : '—' },
                { label: '总耗时', value: lastConversion ? `${Math.round(lastConversion.timingMs)} ms` : '—' },
                { label: 'JS 侧开销', value: lastConversion && lastConversion.conversionMs != null ? `${Math.round(Math.max(0, lastConversion.timingMs - lastConversion.conversionMs))} ms` : '—' },
                { label: '转换结果', value: lastConversion ? (lastConversion.success ? '成功' : '失败') : '—' },
                { label: '设备类型', value: `${info.device.type} (${info.device.tier})` },
                { label: '内存峰值', value: formatSize(stats.peakUsageBytes) },
                { label: '当前内存', value: formatSize(stats.currentUsageBytes) },
                { label: '分配次数', value: stats.totalAllocations.toLocaleString() },
                { label: '释放次数', value: stats.totalFrees.toLocaleString() },
                { label: '分配失败', value: stats.failedAllocations.toLocaleString(), cls: stats.failedAllocations > 0 ? 'error' : '' },
                { label: '热池可用', value: stats.hotAvailable.toLocaleString() },
                { label: '工作区已用', value: `${stats.workUsed}/${stats.workCapacity}`, cls: stats.workUsed > stats.workCapacity * 0.9 ? 'warn' : '' },
                { label: '工作区峰值', value: stats.workPeak.toLocaleString() },
                { label: '推荐上限', value: `${info.recommendedMaxFileSize}MB` },
            ];

            grid.innerHTML = rows.map(r =>
                `<div class="perf-item${r.cls ? ' ' + r.cls : ''}"><span class="label">${r.label}</span><span class="value">${r.value}</span></div>`
            ).join('');
        }

        async function init() {
            memManager = new SmartMemoryManager();
            const info = memManager.getInfo();

            const deviceIcon = info.device.isMobile ? '📱' : '💻';
            const tierLabel = { low: '低端', medium: '中端', high: '高端' }[info.device.tier];

            showStatus(`<span class="loading-spinner"></span>正在加载 WASM 模块...<br>
                <small style="opacity:0.7">${deviceIcon} ${info.device.type} (${tierLabel}) | 推荐 ≤${info.recommendedMaxFileSize}MB</small>`, 'loading');

            try {
                const memConfig = memManager.getWasmMemoryConfig();
                // wasmLoadStamp 用于在状态栏显示本次实际加载的 wasm 加载时间戳，
                // 便于确认浏览器没有命中旧 wasm 缓存（对比值变化即已刷新）。
                window.spzLoadStamp = Date.now();
                spz2glb = await loadSpz2Glb('./spz2glb.wasm', { memory: memConfig.memory });
                renderPerfPanel();
                showStatus(`✅ WASM 加载成功！版本: ${spz2glb.getVersion()} · wasm@${window.spzLoadStamp}<br>
                    <small style="opacity:0.7">最大并行: ${MAX_PARALLEL} | 建议文件 ≤ ${info.recommendedMaxFileSize}MB</small>`, 'success');
                setTimeout(() => {
                    if (queue.every(item => item.status !== 'queued' && item.status !== 'processing')) {
                        document.getElementById('statusBox').style.display = 'none';
                    }
                }, 3000);
            } catch (err) {
                showStatus('❌ WASM 加载失败: ' + err.message, 'error');
            }
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--primary)';
        });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#d1d5db'; });
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.style.borderColor = '#d1d5db';
            const files = e.dataTransfer.files;
            if (files.length > 0) addFilesToQueue(files);
        });
        fileInput.addEventListener('change', () => {
            const files = fileInput.files;
            if (files.length > 0) addFilesToQueue(files);
            fileInput.value = '';
        });

        init();
    </script>
</body>
</html>
